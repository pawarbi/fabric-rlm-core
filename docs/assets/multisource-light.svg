<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" width="1060" height="610" style="max-width:100%;height:auto" role="img" aria-labelledby="multisource-light-title multisource-light-desc">
  <title id="multisource-light-title">Fabric data sources to an Excel workbook with Fabric-RLM</title>
  <desc id="multisource-light-desc">Illustrative workflow: 2 semantic models, 2 Delta tables, 3 CSV files, and 1 PDF feed Fabric-RLM inside a Microsoft Fabric notebook. Optional skills provide user-supplied playbooks and domain rules, not automatically loaded context. The model writes Python, queries semantic models via DAX, reads Delta tables and files, and builds and reopens an Excel workbook saved to Lakehouse Files. You choose the sources, skills, and acceptance checks.</desc>
  <defs>
    <marker id="multisource-light-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
  </defs>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">
    <rect x="24" y="46" width="300" height="500" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="44" y="80" font-size="20" font-weight="600">Fabric data sources</text>
    <text x="44" y="104" font-size="14" fill="#59636e">Models, Lakehouse tables and files</text>

    <rect x="44" y="122" width="260" height="88" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="64" y="156" font-size="18" font-weight="600">2 semantic models</text>
    <text x="64" y="182" fill="#59636e">Manufacturing Ops, ARR</text>
    <rect x="44" y="222" width="260" height="88" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="64" y="256" font-size="18" font-weight="600">2 Delta tables</text>
    <text x="64" y="282" fill="#59636e">production, inventory</text>
    <rect x="44" y="322" width="260" height="88" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="64" y="356" font-size="18" font-weight="600">3 CSV files</text>
    <text x="64" y="382" fill="#59636e">targets, headcount, FX rates</text>
    <rect x="44" y="422" width="260" height="88" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="64" y="456" font-size="18" font-weight="600">1 PDF</text>
    <text x="64" y="482" fill="#59636e">operations review brief</text>

    <rect x="390" y="20" width="350" height="100" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="410" y="49" font-size="20" font-weight="600">Skills (optional context)</text>
    <text x="410" y="76" fill="#59636e">Playbooks and domain rules</text>
    <text x="410" y="101" font-size="14" fill="#59636e">You supply context; no automatic loading.</text>

    <rect x="390" y="165" width="350" height="310" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="410" y="201" font-size="20" font-weight="600">Microsoft Fabric notebook</text>
    <rect x="408" y="224" width="314" height="233" rx="8" fill="#e6f6f4" stroke="#1b7c83"/>
    <text x="428" y="258" font-size="22" font-weight="600">Fabric-RLM</text>
    <text x="428" y="288" fill="#59636e">The model writes Python to:</text>
    <path d="M428 305 H702" fill="none" stroke="#1b7c83" opacity="0.35"/>
    <text x="428" y="333">Query semantic models via DAX</text>
    <text x="428" y="365">Read Delta tables and files</text>
    <text x="428" y="397">Build and reopen the workbook</text>
    <text x="428" y="434" font-size="14" fill="#59636e">Guided by your task and checks</text>

    <rect x="784" y="190" width="252" height="280" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <g aria-hidden="true">
      <rect x="804" y="212" width="100" height="56" rx="4" fill="#ffffff" stroke="#1a7f37"/>
      <path d="M808 212 H900 Q904 212 904 216 V228 H804 V216 Q804 212 808 212 Z" fill="#1a7f37"/>
      <path d="M804 228 H904 M804 248 H904 M830 228 V268 M866 228 V268" fill="none" stroke="#1a7f37"/>
    </g>
    <text x="804" y="300" font-size="20" font-weight="600">Excel workbook</text>
    <text x="804" y="328" font-weight="600">ops_review.xlsx</text>
    <text x="804" y="364" fill="#59636e">Saved to Lakehouse Files</text>
    <text x="804" y="407" font-size="14" fill="#59636e">Summary / detail / source notes</text>

    <g fill="none" stroke="#8c959f" stroke-width="1.8" marker-end="url(#multisource-light-arrow)">
      <path d="M324 332 H390"/>
      <path d="M565 120 V165"/>
      <path d="M740 332 H784"/>
    </g>
    <rect x="24" y="562" width="1012" height="34" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="530" y="584" font-size="14" fill="#59636e" text-anchor="middle">Illustrative workflow. You choose the sources, skills, and acceptance checks.</text>
  </g>
</svg>
