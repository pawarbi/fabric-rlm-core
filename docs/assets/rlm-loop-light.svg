<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620" role="img" aria-labelledby="title desc">
  <title id="title">The fabric-rlm execution loop</title>
  <desc id="desc">Read the main loop left to right: the model plans and writes Python, the worker executes it in persistent CPython state, and the model inspects results and revises. Repeat as needed. Planning is model behavior, not an enforced state machine. The dashed inset beneath the worker shows optional recursive delegation: worker code delegates a subproblem to a configured sub_lm, which returns to the worker. This is not an automatic full RLM loop. From inspection, follow the submit branch down, then right to left: SUBMIT candidate, configured checks, accepted result. Rejection feedback returns to the model. Budget exhausted: no accepted answer. Only configured checks run. Acceptance is not a proof of correctness.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0969da"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0e7c78"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bc4c00"/></marker>
  </defs>
  <rect width="1060" height="620" fill="#ffffff"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563">
    <rect x="24" y="24" width="1012" height="432" rx="16" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="48" y="59" font-size="22" font-weight="600">Main execution loop</text>
    <text x="48" y="84" fill="#59636e">Planning and revision are model behavior, not an enforced state machine.</text>

    <g fill="none" stroke="#0969da" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue-arrow)">
      <path d="M338 200H398"/>
      <path d="M662 200H718"/>
      <path d="M855 156V128H203V156"/>
    </g>
    <text x="529" y="117" text-anchor="middle" fill="#0969da">Repeat as needed</text>

    <rect x="68" y="156" width="270" height="88" rx="10" fill="#ffffff" stroke="#0969da"/>
    <text x="88" y="192" font-size="18" font-weight="600">Model: plan / write Python</text>
    <text x="88" y="219" fill="#59636e">Choose the next code to run</text>

    <rect x="398" y="156" width="264" height="88" rx="10" fill="#ffffff" stroke="#0e7c78"/>
    <text x="418" y="192" font-size="18" font-weight="600">Worker: execute</text>
    <text x="418" y="219" fill="#59636e">Default: persistent CPython state</text>

    <rect x="718" y="156" width="274" height="88" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="738" y="192" font-size="18" font-weight="600">Inspect results / revise</text>
    <text x="738" y="219" fill="#59636e">Model uses execution feedback</text>

    <g fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="3 5" stroke-linecap="round" marker-end="url(#orange-arrow)">
      <path d="M450 244V298"/>
      <path d="M614 298V244"/>
    </g>
    <text x="436" y="277" text-anchor="end" fill="#bc4c00">Call</text>
    <text x="628" y="277" fill="#bc4c00">Return</text>
    <rect x="322" y="298" width="484" height="136" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-dasharray="5 5"/>
    <text x="342" y="325" font-size="17" font-weight="600">Optional recursive delegation</text>
    <text x="342" y="349" fill="#59636e">Optional sub-model calls</text>
    <text x="342" y="383">Delegate a subproblem</text>
    <text x="544" y="383" font-weight="600">sub-model</text>
    <text x="666" y="383">Return to worker</text>
    <g fill="none" stroke="#bc4c00" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round" marker-end="url(#orange-arrow)">
      <path d="M504 378H532"/>
      <path d="M624 378H654"/>
    </g>
    <text x="342" y="413" fill="#59636e">sub_lm: configurable; not an automatic full RLM loop</text>

    <path d="M68 319H100" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="68" y="346" fill="#59636e">Budget exhausted:</text>
    <text x="68" y="369" fill="#59636e">no accepted answer</text>

    <path d="M855 244V484" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <text x="872" y="473" fill="#0969da">Submit</text>
    <rect x="718" y="484" width="274" height="58" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="855" y="519" text-anchor="middle" font-size="18" font-weight="600">SUBMIT candidate</text>
    <path d="M718 513H662" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <rect x="398" y="484" width="264" height="58" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
    <text x="530" y="519" text-anchor="middle" font-size="18" font-weight="600">Configured checks</text>
    <path d="M398 513H338" fill="none" stroke="#0e7c78" stroke-width="2" marker-end="url(#teal-arrow)"/>
    <rect x="68" y="484" width="270" height="58" rx="10" fill="#e6f6f2" stroke="#0e7c78"/>
    <text x="203" y="519" text-anchor="middle" font-size="18" font-weight="600">Accepted result</text>

    <path d="M530 542V568H46V200H68" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue-arrow)"/>
    <text x="288" y="561" text-anchor="middle" fill="#0969da">Rejected: feedback to model</text>
    <rect x="24" y="584" width="1012" height="32" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="530" y="605" text-anchor="middle" fill="#59636e">Only configured checks run. Acceptance is not a proof of correctness.</text>
  </g>
</svg>
