[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-rlm"
dynamic = ["version"]
description = "A portable Python subprocess runtime for Recursive Language Models in Fabric notebooks and managed Python environments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sandeep Pawar" }]
license = "MIT"
keywords = [
  "rlm",
  "recursive-language-model",
  "llm",
  "agents",
  "code-interpreter",
  "dspy",
  "fabric",
  "microsoft-fabric",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # aiohttp is not imported by fabric_rlm directly. The >=3.12 floor exists to
  # pre-empt the Fabric Synapse cluster-env conflict where an old aiohttp/yarl
  # pair crashes dspy at import time — see docs/fabric-runtime-deps.md.
  "aiohttp>=3.12",
  # Floor is 3.2.1: the subprocess interpreter mirrors dspy's kwargs-only tool
  # dispatch (3.2.0) and JSON-RPC CodeInterpreter messaging (3.1.3), neither of
  # which exists in 3.1.2. Ceiling guards against churn in dspy's experimental
  # RLM / CodeInterpreter internals that this package tracks.
  #
  # Held below 3.3 as of 2026-08-03. dspy 3.3.0 shipped that afternoon and
  # turned every job red within hours, on a ceiling of <3.4 that permitted it:
  #
  #   * RLM's ``max_iterations`` was renamed ``max_iters``, which is the
  #     immediate failure (``RLM.__init__() got an unexpected keyword argument``)
  #   * ``Image``/``Audio``/``File`` no longer perform implicit I/O; construction
  #     now needs ``Image.from_path()``. ``_wrap_single_image`` still passes a
  #     path to the constructor, and no test covers image inputs, so that one
  #     would have broken for users rather than in CI.
  #   * interpreter failures became terminal instead of auto-restarting, which
  #     is the opposite of ``recover_worker_timeouts`` on the dspy engine path
  #   * LM errors now raise DSPy exception classes rather than provider ones,
  #     so anything matching on provider exception names stops matching
  #
  # Lift the ceiling once those are handled; 3.3.0 also adds
  # ``interpreter_factory=``, which is the hook for letting our own Interpreter
  # drive the dspy path instead of maintaining two execution paths.
  "dspy>=3.2.1,<3.3",
  # litellm reaches us through dspy. From 1.92.0 it publishes only manylinux
  # wheels, so pip falls back to building the sdist on Windows and macOS, which
  # needs a Rust toolchain and breaks a plain `pip install fabric-rlm`. 1.91.4 is
  # the last release with a universal wheel. Relax this once litellm ships
  # Windows and macOS wheels again.
  "litellm>=1.64,<1.92",
  "nest_asyncio>=1.6",
  "pydantic>=2",
  "typing_extensions>=4.15",
]

[project.urls]
Homepage = "https://github.com/pawarbi/fabric-rlm-core"
Repository = "https://github.com/pawarbi/fabric-rlm-core"
Issues = "https://github.com/pawarbi/fabric-rlm-core/issues"
Changelog = "https://github.com/pawarbi/fabric-rlm-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]
fabric = [
  "synapseml",
]
pdf = [
  "pymupdf>=1.24",
]
analytics = [
  "duckdb>=1.1",
  # SemanticModel.metadata() and normalized DAX results return ordinary pandas
  # DataFrames outside Fabric as well as in the SemPy notebook runtime.
  "pandas>=2.0",
  "polars>=1.0",
  # delta_lakehouse skill: the reader used when DuckDB's `delta` extension
  # cannot be downloaded (no-egress runtimes). Pure-Python wheel, no build step.
  # 1.0 is the floor for `DeltaTable.file_uris()`, which replaced `.files()`.
  "deltalake>=1.0",
]

[project.scripts]
fabric-rlm = "fabric_rlm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fabric_rlm.__version__" }

[tool.setuptools.packages.find]
include = ["fabric_rlm*"]

[tool.setuptools.package-data]
"fabric_rlm" = ["py.typed"]
"fabric_rlm.skills" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "experimental: opt-in tests for fabric_rlm.experimental modules",
  "primary: behavior CI gate against the primary blocking model (requires OPENROUTER_API_KEY)",
  "secondary_free: behavior CI gate against a free-tier model (informational, requires OPENROUTER_API_KEY)",
]
