[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-rlm"
dynamic = ["version"]
description = "A portable Python subprocess runtime for Recursive Language Models in Fabric notebooks and managed Python environments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sandeep Pawar" }]
license = { text = "MIT" }
keywords = [
  "rlm",
  "recursive-language-model",
  "llm",
  "agents",
  "code-interpreter",
  "dspy",
  "fabric",
  "microsoft-fabric",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # aiohttp is not imported by fabric_rlm directly. The >=3.12 floor exists to
  # pre-empt the Fabric Synapse cluster-env conflict where an old aiohttp/yarl
  # pair crashes dspy at import time — see docs/fabric-runtime-deps.md.
  "aiohttp>=3.12",
  # Floor is 3.2.1: the subprocess interpreter mirrors dspy's kwargs-only tool
  # dispatch (3.2.0) and JSON-RPC CodeInterpreter messaging (3.1.3), neither of
  # which exists in 3.1.2. Ceiling guards against churn in dspy's experimental
  # RLM / CodeInterpreter internals that this package tracks.
  "dspy>=3.2.1,<3.4",
  # litellm reaches us through dspy. From 1.92.0 it publishes only manylinux
  # wheels, so pip falls back to building the sdist on Windows and macOS, which
  # needs a Rust toolchain and breaks a plain `pip install fabric-rlm`. 1.91.4 is
  # the last release with a universal wheel. Relax this once litellm ships
  # Windows and macOS wheels again.
  "litellm>=1.64,<1.92",
  "nest_asyncio>=1.6",
  "pydantic>=2",
  "typing_extensions>=4.15",
]

[project.urls]
Homepage = "https://github.com/pawarbi/fabric-rlm-core"
Repository = "https://github.com/pawarbi/fabric-rlm-core"
Issues = "https://github.com/pawarbi/fabric-rlm-core/issues"
Changelog = "https://github.com/pawarbi/fabric-rlm-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]
fabric = [
  "synapseml",
]
pdf = [
  "pymupdf>=1.24",
]
analytics = [
  "duckdb>=1.1",
  "polars>=1.0",
]

[project.scripts]
fabric-rlm = "fabric_rlm.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fabric_rlm.__version__" }

[tool.setuptools.packages.find]
include = ["fabric_rlm*"]

[tool.setuptools.package-data]
"fabric_rlm" = ["py.typed"]
"fabric_rlm.skills" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
  "experimental: opt-in tests for fabric_rlm.experimental modules",
  "primary: behavior CI gate against the primary blocking model (requires OPENROUTER_API_KEY)",
  "secondary_free: behavior CI gate against a free-tier model (informational, requires OPENROUTER_API_KEY)",
]
