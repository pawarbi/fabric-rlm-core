name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the Windows leg lean: oldest + newest supported only.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  package:
    name: build + metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Twine metadata check
        run: twine check dist/*
      - name: Wheel content assertions (skills md + py.typed)
        run: |
          python - <<'EOF'
          import glob, zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          skills = [n for n in names if n.startswith("fabric_rlm/skills/") and n.endswith(".md")]
          assert len(skills) >= 8, f"expected bundled skill markdown in wheel, got: {skills}"
          assert "fabric_rlm/py.typed" in names, "py.typed missing from wheel"
          print(f"OK: {wheel} ships {len(skills)} skill files + py.typed")
          EOF
